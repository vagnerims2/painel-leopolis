name: Investigar portal
on:
  push:
    branches: [investigacao]
permissions:
  contents: write
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p saida6; B="https://leopolispr.equiplano.com.br:7300/transparencia/relacaoDocumentosFiscais/listaRelacaoDocumentosFiscaisAjax"
          F="formulario.tpFiltroRelacaoDocFiscais=1&formulario.codEntidade=300&formulario.codFornecedor=&formulario.idOrgao=&formulario.idUnidade="
          curl -sSk -m 200 -X POST -d "$F&formulario.dtInicial=16/10/2026&formulario.dtFinal=19/10/2026&draw=2&start=50&length=50&order[0][column]=1&order[0][dir]=asc" "$B" -o saida6/a1.json -w "%{http_code} %{content_type} %{size_download}\n" >> saida6/t.txt
          curl -sSk -m 300 -X POST -d "$F&formulario.dtInicial=01/01/2026&formulario.dtFinal=31/01/2026&draw=1&start=0&length=2000" "$B" -o saida6/a2.json -w "%{http_code} %{content_type} %{size_download} %{time_total}\n" >> saida6/t.txt
          head -c 2500 saida6/a1.json >> saida6/t.txt
      - run: |
          git config user.name "Painel Leopolis (GitHub)"; git config user.email "vagnerims2@users.noreply.github.com"
          git add saida6 && git commit -qm "resultado6" && git push -q origin investigacao
