name: Investigar portal
on:
  push:
    branches: [investigacao]
permissions:
  contents: write
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p saida2; B="https://leopolispr.equiplano.com.br:7300/transparencia"
          Q="formulario.tpFiltroRelacaoDocFiscais=1&formulario.dtInicial=16/10/2026&formulario.dtFinal=19/10/2026&formulario.codEntidade=300&formulario.codFornecedor=&formulario.nrDocumento=&formulario.nmFornecedor=&formulario.idOrgao=&formulario.idUnidade="
          curl -sSk -m 120 "$B/relacaoDocumentosFiscais/listaRelacaoDocumentosFiscais?$Q" -o saida2/lista_get.html -w "GET %{http_code} %{size_download}\n"
          curl -sSk -m 120 -X POST -d "$Q" "$B/relacaoDocumentosFiscais/listaRelacaoDocumentosFiscais" -o saida2/lista_post.html -w "POST %{http_code} %{size_download}\n"
          ls -la saida2
      - run: |
          git config user.name "Painel Leopolis (GitHub)"; git config user.email "vagnerims2@users.noreply.github.com"
          git add saida2 && git commit -qm "resultado2" && git push -q origin investigacao
