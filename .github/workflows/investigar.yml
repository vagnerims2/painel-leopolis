name: Investigar portal
on:
  push:
    branches: [investigacao]
permissions:
  contents: write
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p saida10; B="https://leopolispr.equiplano.com.br:7300/transparencia/requisicoesCompra/process"
          Q="formulario.codFornecedor=&formulario.codEntidade=300&formulario.dataInicial=13/10/2026&formulario.dataFinal=20/10/2026&formulario.nrDocumento=&formulario.nmFornecedor=&formulario.codProduto=&formulario.nmProduto=&formulario.numeroLicitacao=&formulario.codTipoLicitacao=&formulario.exercicioLicitacao="
          curl -sSk -m 200 "$B?$Q&formulario.tpFormatoExterno=CSV" -o saida10/req.csv -w "%{http_code} %{content_type} %{size_download}\n" > saida10/t.txt
          curl -sSk -m 200 "$B?$Q&formulario.tpFormatoExterno=PDF" -o saida10/req.pdf -w "%{http_code} %{content_type} %{size_download}\n" >> saida10/t.txt
          curl -sSk -m 200 -X POST -d "$Q&formulario.tpFormatoExterno=CSV" "$B" -o saida10/req_post.csv -w "%{http_code} %{content_type} %{size_download}\n" >> saida10/t.txt
      - run: |
          git config user.name "Painel Leopolis (GitHub)"; git config user.email "vagnerims2@users.noreply.github.com"
          git add saida10 && git commit -qm "resultado10" && git push -q origin investigacao
