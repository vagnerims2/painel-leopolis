name: Investigar portal
on:
  push:
    branches: [investigacao]
permissions:
  contents: write
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p saida3; B="https://leopolispr.equiplano.com.br:7300/transparencia"
          curl -sSk -m 120 -D saida3/h1.txt "$B/relacaoDocumentosFiscais/downloadDocumento?formulario.idFornecedorDoc=92319" -o saida3/doc1.bin -w "%{http_code} %{content_type} %{size_download}\n" > saida3/st.txt
          curl -sSk -m 120 -D saida3/h2.txt "$B/relacaoDocumentosFiscais/downloadDocumento?formulario.idFornecedorDoc=92324" -o saida3/doc2.bin -w "%{http_code} %{content_type} %{size_download}\n" >> saida3/st.txt
          file saida3/doc1.bin saida3/doc2.bin >> saida3/st.txt
      - run: |
          git config user.name "Painel Leopolis (GitHub)"; git config user.email "vagnerims2@users.noreply.github.com"
          git add saida3 && git commit -qm "resultado3" && git push -q origin investigacao
