name: Investigar portal
on:
  push:
    branches: [investigacao]
permissions:
  contents: write
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p saida8; pip install -q requests
          python3 - <<'PY'
          import sys; sys.path.insert(0,'.')
          import motor_coleta as c
          t = c.tabelas_mes(2026, 10)
          url = [r['a'] for r in t['emp'] if r['a'] and r['c'][1] == '13/10/2026'][0]
          open('saida8/emp_13_10.txt', 'w').write(c.pdf_texto(url)[:60000])
          PY
      - run: |
          git config user.name "Painel Leopolis (GitHub)"; git config user.email "vagnerims2@users.noreply.github.com"
          git add saida8 && git commit -qm "resultado8" && git push -q origin investigacao
