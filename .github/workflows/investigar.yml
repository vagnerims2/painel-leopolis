name: Investigar portal
on:
  push:
    branches: [investigacao]
permissions:
  contents: write
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p saida9; B="https://leopolispr.equiplano.com.br:7300/transparencia"
          for u in requisicoesCompra licitacoes extratoFornecedor contratosFornecedor fiscaisContratos; do curl -sSk -m 90 "$B/$u" -o "saida9/$u.html"; done
          ls -la saida9
      - run: |
          git config user.name "Painel Leopolis (GitHub)"; git config user.email "vagnerims2@users.noreply.github.com"
          git add saida9 && git commit -qm "resultado9" && git push -q origin investigacao
