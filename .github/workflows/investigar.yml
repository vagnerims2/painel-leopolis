name: Investigar portal
on:
  push:
    branches: [investigacao]
permissions:
  contents: write
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p saida5; O="https://leopolispr.equiplano.com.br:7300"; B="$O/transparencia/relacaoDocumentosFiscais/listaRelacaoDocumentosFiscais"
          Q="formulario.tpFiltroRelacaoDocFiscais=1&formulario.dtInicial=16/10/2026&formulario.dtFinal=19/10/2026&formulario.codEntidade=300&formulario.codFornecedor=&formulario.nrDocumento=&formulario.nmFornecedor=&formulario.idOrgao=&formulario.idUnidade="
          curl -sSk -m 60 "$O/esadmin/recursos/equiplano/js/monta-tabela-dinamica-2.0.js" -o saida5/monta.js
          curl -sSk -m 200 "$B?$Q&6578706f7274=1&d-5470-e=1" -o saida5/exp_csv.txt
          curl -sSk -m 200 "$B?$Q&6578706f7274=1&d-5470-e=2" -o saida5/exp_xls.txt
          curl -sSk -m 200 -X POST -d "$Q&d-5470-p=2" "$B" -o saida5/post_p2.html
          for f in saida5/post_p2.html; do echo "$f $(grep -o 'idFornecedorDoc=[0-9]*' $f | head -1)" >> saida5/t.txt; done
          head -c 1500 saida5/exp_csv.txt >> saida5/t.txt; echo >> saida5/t.txt; head -c 1500 saida5/exp_xls.txt >> saida5/t.txt
      - run: |
          git config user.name "Painel Leopolis (GitHub)"; git config user.email "vagnerims2@users.noreply.github.com"
          git add saida5 && git commit -qm "resultado5" && git push -q origin investigacao
