name: Teste de acesso ao portal
on:
  push:
    paths: ['.github/workflows/teste_portal.yml']
  workflow_dispatch:
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Tabela de empenhos de outubro
        run: |
          curl -sS -k -m 60 -o t.html -w "HTTP %{http_code} em %{time_total}s\n" "https://leopolispr.equiplano.com.br:7300/transparencia/despesaEmpenhada/listaData?formulario.codEntidade=300&formulario.exercicio=2026&formulario.nrMes=10"
          grep -c "/10/2026" t.html
      - name: Saldo por fonte
        run: |
          curl -sS -k -m 60 -o f.html -w "HTTP %{http_code} em %{time_total}s\n" "https://leopolispr.equiplano.com.br:7300/transparencia/despesaEmpenhadaAPagar/listaDespesaEmpenhadaAPagarPorAno?formulario.codEntidade=300&formulario.exercicio=2026"
          grep -c "Recursos" f.html
