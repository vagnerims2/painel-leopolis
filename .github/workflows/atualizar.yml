name: Atualizar painel
# Dias úteis, das 7h30 às 17h30 (Brasília): um turno que lê o portal a cada 20 minutos.
# O GitHub atrasa ou pula agendamentos em horário de pico, então em vez de um disparo a cada 20 min há um turno
# que fica rodando (até ~5h30 por vez, limite do GitHub é 6h). Os disparos de hora em hora (minuto 31) são reserva:
# se já houver turno rodando, o próximo fica na fila e assume quando ele terminar; fora do horário, encerra na hora.
on:
  schedule:
    - cron: '31 10-20 * * 1-5'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Atualizar mesmo sem novidade no portal'
        type: boolean
        default: false
      relatorio:
        description: 'Enviar agora o relatório de requisições em atraso (e-mail)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['motor/**', '.github/workflows/atualizar.yml']
concurrency:
  group: atualizar-painel
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: America/Sao_Paulo
      PAINEL_PASTA: ${{ github.workspace }}/motor/estado
      PAINEL_SITE: ${{ github.workspace }}
      PAINEL_SEM_GIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: motor/requisitos.txt
      - run: pip install -r motor/requisitos.txt
      - name: Recupera o estado da última atualização
        uses: actions/cache/restore@v4
        with:
          path: motor/estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - name: Prepara a pasta de trabalho
        run: |
          mkdir -p motor/estado
          if [ ! -f motor/estado/master.json ]; then
            echo "Primeira vez: começando pela semente"
            gunzip -c motor/semente/master.json.gz > motor/estado/master.json
            cp motor/semente/alertas.json motor/semente/reler.txt motor/semente/ultima_coleta.txt motor/estado/
          fi
          cp motor/painel.py motor/coleta.py motor/build.py motor/financas.py motor/estado/
      - name: Rodadas (uma só em push/manual; no agendamento, a cada 20 min até 17h30)
        env:
          PLANILHA_URL: ${{ secrets.PLANILHA_URL }}
          PENDENTES_PASTA: ${{ secrets.PENDENTES_PASTA }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_SENHA_APP: ${{ secrets.GMAIL_SENHA_APP }}
          RELATORIO_PARA: ${{ secrets.RELATORIO_PARA }}
          RELATORIO_AGORA: ${{ github.event.inputs.relatorio }}
          EVENTO: ${{ github.event_name }}
          FORCAR: ${{ (github.event_name == 'push' || github.event.inputs.forcar == 'true') && '--forcar' || '' }}
          INTERVALO: '1200'
        run: |
          git config user.name "Painel Leopolis (GitHub)"
          git config user.email "vagnerims2@users.noreply.github.com"
          if [ "$EVENTO" != "schedule" ]; then bash ferramentas/rodada.sh $FORCAR || true; exit 0; fi
          inicio=$(date +%s); n=0
          while :; do
            agora=$(date +%H%M); dia=$(date +%u)
            if [ "$dia" -gt 5 ] || [ "$agora" -lt 0730 ] || [ "$agora" -ge 1730 ]; then echo "Fora do horário (7h30 às 17h30, dias úteis): encerra o turno."; break; fi
            if [ $(( $(date +%s) - inicio )) -ge 19800 ]; then echo "Turno chegou a 5h30: encerra; o próximo disparo assume."; break; fi
            t0=$(date +%s); n=$((n+1)); echo "::group::Rodada $n — $(date '+%d/%m %H:%M')"
            bash ferramentas/rodada.sh || true
            echo "::endgroup::"
            espera=$(( INTERVALO - ($(date +%s) - t0) )); [ $espera -gt 0 ] && sleep $espera
          done
      - name: Guarda o estado para a próxima vez
        if: always()
        uses: actions/cache/save@v4
        with:
          path: motor/estado
          key: estado-${{ github.run_id }}
      - name: Registro
        if: always()
        run: tail -n 30 motor/estado/painel.log || true
