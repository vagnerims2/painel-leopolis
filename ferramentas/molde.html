<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--CAB-->
<title>Painel de Empenhos — Leópolis</title>
<meta name="description" content="Empenhos, liquidações e pagamentos da Prefeitura Municipal de Leópolis-PR, com dados do Portal da Transparência.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23255f85'/%3E%3Crect x='7' y='17' width='4' height='8' fill='white'/%3E%3Crect x='14' y='11' width='4' height='14' fill='white'/%3E%3Crect x='21' y='7' width='4' height='18' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
:root{
  --font-anthropic-sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-anthropic-serif:"Source Serif 4",Georgia,serif;
  --color-bg:#f5f4ef;--color-panel:#ffffff;--color-fg:#1f1e1b;--color-fg-muted:#6b6862;--color-border-line:#e3e0d8;
  --color-ok:#2f7d4f;--color-warn:#b7791f;--color-bad:#c0392b;
  --cds-radius:8px;--cds-border:1px solid var(--color-border-line);--cds-dur-slow:.25s;--cds-ease-out:cubic-bezier(.2,.7,.2,1);
  --cds-font-size-caption:.8125rem;--cds-font-size-heading:1.125rem;--cds-font-size-title:1.5rem;--cds-font-weight-medium:600;
  --cds-gap-xs:4px;--cds-gap-sm:8px;--cds-gap-md:12px;--cds-gap-lg:20px;--cds-pad-xs:4px;--cds-pad-sm:8px;--cds-pad-md:12px;--cds-pad-lg:18px;--cds-pad-xl:28px;
  --cds-surface-popover:#ffffff;--cds-shadow-popover:0 8px 28px rgba(0,0,0,.16);--cds-text-secondary:var(--color-fg-muted);
  --serie0:#255f85;--serie1:#2a9d8f;--serie2:#e9a03b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --color-bg:#171614;--color-panel:#211f1c;--color-fg:#eeeae2;--color-fg-muted:#a29d93;--color-border-line:#36332e;
  --color-ok:#5fbf85;--color-warn:#e2a64a;--color-bad:#e5675a;--cds-surface-popover:#2a2824;--cds-shadow-popover:0 8px 28px rgba(0,0,0,.5);
  --serie0:#6fa8d6;--serie1:#4cc2b3;--serie2:#f0b45a;color-scheme:dark}}
:root[data-theme=dark]{--color-bg:#171614;--color-panel:#211f1c;--color-fg:#eeeae2;--color-fg-muted:#a29d93;--color-border-line:#36332e;
  --color-ok:#5fbf85;--color-warn:#e2a64a;--color-bad:#e5675a;--cds-surface-popover:#2a2824;--cds-shadow-popover:0 8px 28px rgba(0,0,0,.5);
  --serie0:#6fa8d6;--serie1:#4cc2b3;--serie2:#f0b45a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#e4e7ec;color:var(--color-fg);font-family:var(--font-anthropic-sans);font-size:15px;-webkit-text-size-adjust:100%}
#dash-root{max-width:1320px;margin:0 auto;padding:0;overflow:hidden}
@media (min-width:1360px){#dash-root{margin:16px auto}}
#dash-root a{color:var(--serie0)}
.dash-skeleton{color:transparent!important;background:linear-gradient(90deg,color-mix(in srgb,var(--color-fg) 6%,transparent),color-mix(in srgb,var(--color-fg) 12%,transparent),color-mix(in srgb,var(--color-fg) 6%,transparent));background-size:200% 100%;animation:skel 1.2s infinite linear;border-radius:6px;min-height:1em}
@keyframes skel{to{background-position:-200% 0}}
/*ESTILO*/
</style>
</head>
<body>
<div id="dash-root">
<!--CORPO-->
</div>
<script>
/* Substitui o ambiente do painel do Claude: carrega os CSVs desta pasta e calcula tudo no navegador. */
(function () {
  const FONTES = ['empenhos', 'itens', 'movimento', 'liquidacoes', 'saldo_fontes', 'dotacoes'];
  const css = getComputedStyle(document.documentElement);
  const cor = (n) => css.getPropertyValue(n).trim();
  const brutos = {}, calcs = {}, cache = {}, ouvintes = [];
  let estado = 'loading';
  function parseCSV(t) { const rows = []; let f = '', r = [], q = false;
    for (let i = 0; i < t.length; i++) { const c = t[i];
      if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true; else if (c === ',') { r.push(f); f = ''; } else if (c === '\n') { r.push(f); rows.push(r); r = []; f = ''; } else if (c !== '\r') f += c; }
    if (f || r.length) { r.push(f); rows.push(r); }
    const h = rows.shift() || []; return rows.filter(x => x.length > 1).map(x => Object.fromEntries(h.map((k, j) => [k, x[j] ?? '']))); }
  window.dash = {
    colors: [cor('--serie0'), cor('--serie1'), cor('--serie2')],
    calc(id, o) { calcs[id] = o; },
    data(id) {
      if (estado !== 'ok') return { status: estado, data: [] };
      if (id in brutos) return { status: 'ok', data: brutos[id] };
      if (!(id in cache)) { const c = calcs[id]; if (!c) return { status: 'error', data: [] };
        try { cache[id] = c.fn(...c.inputs.map(i => window.dash.data(i).data)); } catch (e) { console.error(id, e); return { status: 'error', data: [] }; } }
      return { status: 'ok', data: cache[id] };
    },
    onData(f) { ouvintes.push(f); f(); },
    setLink(aba) { try { history.replaceState(null, '', '#' + aba); } catch (e) {} }
  };
  const v = Date.now();
  fetch('__DADOS__atualizado.txt?v=' + v).then(r => r.ok ? r.text() : '').then(t => { const el = document.getElementById('atualizado'); if (el && t.trim()) el.textContent = 'Última atualização: ' + t.trim() + '.'; }).catch(() => {});
  const OPCIONAIS = ['requisicoes'];
  Promise.all(FONTES.map(n => fetch('__DADOS__' + n + '.csv?v=' + v).then(r => { if (!r.ok) throw new Error(n); return r.text(); }).then(t => { brutos[n] = parseCSV(t); }))
    .concat(OPCIONAIS.map(n => fetch('__DADOS__' + n + '.csv?v=' + v).then(r => r.ok ? r.text() : '').then(t => { if (t) brutos[n] = parseCSV(t); }).catch(() => {}))))
    .then(() => { estado = 'ok'; }).catch(e => { console.error(e); estado = 'error'; })
    .finally(() => ouvintes.forEach(f => f()));
})();
</script>
<script>
/*PAGINA*/
</script>
</body>
</html>
